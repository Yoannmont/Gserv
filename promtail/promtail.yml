server:
  http_listen_port: 9080

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: gserv
    static_configs:
      - targets:
          - localhost
        labels:
          job: gserv
          env: dev
          __path__: /var/log/gserv/*.log
    pipeline_stages:
      - json:
          expressions:
            level: levelname
            timestamp: asctime
            app: name
      - labels:
          level:
          env: 
          job: 
          app:

      - timestamp:
          source: asctime
          format: "2006-01-02 15:04:05"
